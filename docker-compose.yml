# PRODUCTION compose - deployed manually for now: git pull on the server,
# then `docker compose up -d`. Mirrors the aksel-pedersen / cosycreator
# pattern: web (Traefik) + internal networks, ${SITE_DOMAIN}_<svc> names,
# lets-encrypt resolver.
#
# Required in .env next to this file:
#   SITE_DOMAIN=bathong.africa
#   ALT_DOMAIN=bathong.org
#   DB_PASSWORD, PAYLOAD_SECRET, CORS_ORIGINS, STAGING_BASIC_AUTH
#   SMTP_PASS (the noreply@ mailbox password, from the mail repo's setup-bathong.sh)
#
# Since the M3 cutover (#12) the platform IS the site: start everything with
# `docker compose --profile platform up -d`. bathong_nuxt carries
# ${SITE_DOMAIN}; the holding container stays as the unrouted fallback.
networks:
  web:
    external: true
  internal:
    external: false

services:
  # Retired at the M3 cutover (#12): bathong_nuxt now carries the primary
  # host. The container stays as the fallback - re-point the primary router
  # here if the platform ever needs to come down.
  bathong_holding:
    image: nginx:alpine
    container_name: ${SITE_DOMAIN}_holding
    restart: always
    volumes:
      - ./holding:/usr/share/nginx/html:ro
    networks:
      - web
    labels:
      - traefik.enable=false

  bathong_db:
    profiles: ["platform"]
    image: postgres:16-alpine
    container_name: ${SITE_DOMAIN}_db
    restart: always
    environment:
      POSTGRES_DB: bathong
      POSTGRES_USER: bathong
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bathong -d bathong']
      interval: 5s
      timeout: 3s
      retries: 24
    labels:
      - traefik.enable=false

  bathong_payload:
    profiles: ["platform"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PAYLOAD_PUBLIC_SERVER_URL: https://api.${SITE_DOMAIN}
    image: bathong-payload:latest
    container_name: ${SITE_DOMAIN}_payload
    restart: always
    volumes:
      - ./media:/app/media
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://bathong:${DB_PASSWORD}@${SITE_DOMAIN}_db:5432/bathong
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: https://api.${SITE_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_DOMAIN: .${SITE_DOMAIN}
      MEDIA_DIR: /app/media
      # Auth emails (password reset; verification once self-signup opens) go
      # out through the collective's mail server as noreply@. Public hostname
      # on purpose: the Let's Encrypt cert matches it, unlike the container
      # aliases on the mail stack's own network.
      SMTP_HOST: mail.madsnorgaard.net
      SMTP_PORT: "465"
      SMTP_USER: noreply@${SITE_DOMAIN}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: noreply@${SITE_DOMAIN}
    depends_on:
      bathong_db:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.bathong_payload.rule=Host(`api.${SITE_DOMAIN}`)
      - traefik.http.routers.bathong_payload.tls=true
      - traefik.http.routers.bathong_payload.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_payload.middlewares=bathong-hsts,bathong-api-headers,bathong-api-ratelimit
      # Baseline headers for the API host - Payload sets none of its own.
      # DENY is safe for the admin panel (no livePreview configured; live
      # preview would iframe the frontend, not the other way around).
      - traefik.http.middlewares.bathong-api-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff
      - traefik.http.middlewares.bathong-api-headers.headers.customResponseHeaders.X-Frame-Options=DENY
      - traefik.http.middlewares.bathong-api-headers.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin
      - traefik.http.services.bathong_payload.loadbalancer.server.port=3001
      # Rate limits: a modest ceiling on the whole API, a strict one on the
      # endpoints an anonymous visitor can write to (login, RSVP create).
      - traefik.http.middlewares.bathong-api-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.bathong-api-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.bathong-strict-ratelimit.ratelimit.average=1
      - traefik.http.middlewares.bathong-strict-ratelimit.ratelimit.burst=5
      - traefik.http.routers.bathong_payload_strict.rule=Host(`api.${SITE_DOMAIN}`) && (PathPrefix(`/api/users/login`) || ((Path(`/api/rsvps`) || Path(`/api/photocall-entries`)) && Method(`POST`)))
      - traefik.http.routers.bathong_payload_strict.priority=100
      - traefik.http.routers.bathong_payload_strict.tls=true
      - traefik.http.routers.bathong_payload_strict.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_payload_strict.middlewares=bathong-hsts,bathong-api-headers,bathong-strict-ratelimit
      - traefik.http.routers.bathong_payload_strict.service=bathong_payload

  # The site. Primary host since the M3 cutover (#12); next.${SITE_DOMAIN}
  # stays as a basic-auth preview router (#39) for reviewing future work.
  # Micro-cache in front of /_ipx/ so each image variant is AVIF-encoded once,
  # not once per visitor (nitro has no server-side result cache and encodes
  # are CPU-expensive). Routes ONLY the /_ipx prefix; everything else still
  # hits bathong_nuxt directly.
  bathong_ipx_cache:
    profiles: ["platform"]
    image: nginx:alpine
    container_name: ${SITE_DOMAIN}_ipx_cache
    restart: always
    volumes:
      - ./ops/ipx-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - ipx_cache:/var/cache/nginx/ipx
    depends_on:
      - bathong_nuxt
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.bathong_ipx.rule=Host(`${SITE_DOMAIN}`) && PathPrefix(`/_ipx/`)
      - traefik.http.routers.bathong_ipx.priority=150
      - traefik.http.routers.bathong_ipx.tls=true
      - traefik.http.routers.bathong_ipx.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_ipx.middlewares=bathong-hsts
      - traefik.http.services.bathong_ipx.loadbalancer.server.port=80

  bathong_nuxt:
    profiles: ["platform"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the ipx allowlist/alias at build time - see frontend/Dockerfile.
        NUXT_PUBLIC_CMS_URL: https://api.${SITE_DOMAIN}
        # ipx source fetches go over the internal network: the container
        # cannot reach its own host's public 443 (hairpin), and this also
        # skips Traefik + the api rate limit while keeping Payload access
        # control on every fetch.
        IPX_SOURCE_URL: http://${SITE_DOMAIN}_payload:3001
    image: bathong-nuxt:latest
    container_name: ${SITE_DOMAIN}_nuxt
    restart: always
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_CMS_URL: https://api.${SITE_DOMAIN}
      NUXT_CMS_INTERNAL_URL: http://${SITE_DOMAIN}_payload:3001
      # Canonical origin for og/canonical URLs.
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://${SITE_DOMAIN}}
      # NOTE: NITRO_IPX_* runtime overrides proved ineffective in production
      # (the ipx handler kept the build-baked config) - the internal source
      # URL is baked via the IPX_SOURCE_URL build arg instead. Do not rely on
      # runtime env for ipx settings.
    depends_on:
      - bathong_payload
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # primary host (#12)
      - traefik.http.routers.bathong_site.rule=Host(`${SITE_DOMAIN}`)
      - traefik.http.routers.bathong_site.tls=true
      - traefik.http.routers.bathong_site.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_site.middlewares=bathong-hsts
      - traefik.http.services.bathong_nuxt.loadbalancer.server.port=3000
      # HSTS (#37) on every router of both hosts. Deliberately starting at one
      # day - raise stsSeconds to 31536000 after a clean week. All subdomains
      # (api., next., www.) terminate TLS at this Traefik, so includeSubdomains
      # is safe. No preload: the preload list is near-irreversible.
      - traefik.http.middlewares.bathong-hsts.headers.stsSeconds=86400
      - traefik.http.middlewares.bathong-hsts.headers.stsIncludeSubdomains=true
      # www + .org variants 301 to the primary host
      - traefik.http.routers.bathong_alias.rule=Host(`www.${SITE_DOMAIN}`) || Host(`${ALT_DOMAIN}`) || Host(`www.${ALT_DOMAIN}`)
      - traefik.http.routers.bathong_alias.tls=true
      - traefik.http.routers.bathong_alias.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_alias.middlewares=bathong-hsts,bathong-primary
      - traefik.http.routers.bathong_alias.service=bathong_nuxt
      - traefik.http.middlewares.bathong-primary.redirectregex.regex=^https?://[^/]+/(.*)
      - traefik.http.middlewares.bathong-primary.redirectregex.replacement=https://${SITE_DOMAIN}/$${1}
      - traefik.http.middlewares.bathong-primary.redirectregex.permanent=true
      # basic-auth preview router (#39), kept for reviewing future work
      - traefik.http.routers.bathong_next.rule=Host(`next.${SITE_DOMAIN}`)
      - traefik.http.routers.bathong_next.tls=true
      - traefik.http.routers.bathong_next.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_next.middlewares=bathong-hsts,bathong-next-auth
      # htpasswd bcrypt user:hash from .env (STAGING_BASIC_AUTH). Generate with
      # `htpasswd -nB bathong`; double every $ as $$ inside .env so compose
      # does not try to interpolate the hash.
      - traefik.http.middlewares.bathong-next-auth.basicauth.users=${STAGING_BASIC_AUTH}

volumes:
  db_data: {}
  ipx_cache: {}
