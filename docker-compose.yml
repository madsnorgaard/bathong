# PRODUCTION compose - deployed manually for now: git pull on the server,
# then `docker compose up -d`. Mirrors the aksel-pedersen / cosycreator
# pattern: web (Traefik) + internal networks, ${SITE_DOMAIN}_<svc> names,
# lets-encrypt resolver.
#
# Required in .env next to this file:
#   SITE_DOMAIN=bathong.africa
#   ALT_DOMAIN=bathong.org
# Platform stage will add: DB_PASSWORD, PAYLOAD_SECRET, CORS_ORIGINS.
#
# Stage 1: the holding page only - `docker compose up -d` starts just nginx.
# The platform services carry the "platform" profile and start with
# `docker compose --profile platform up -d` once the backend is ready;
# the holding router hands ${SITE_DOMAIN} to the frontend at cutover.
networks:
  web:
    external: true
  internal:
    external: false

services:
  bathong_holding:
    image: nginx:alpine
    container_name: ${SITE_DOMAIN}_holding
    restart: always
    volumes:
      - ./holding:/usr/share/nginx/html:ro
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # primary host
      - traefik.http.routers.bathong_holding.rule=Host(`${SITE_DOMAIN}`)
      - traefik.http.routers.bathong_holding.tls=true
      - traefik.http.routers.bathong_holding.tls.certresolver=lets-encrypt
      - traefik.http.services.bathong_holding.loadbalancer.server.port=80
      # www + .org variants 301 to the primary host
      - traefik.http.routers.bathong_alias.rule=Host(`www.${SITE_DOMAIN}`) || Host(`${ALT_DOMAIN}`) || Host(`www.${ALT_DOMAIN}`)
      - traefik.http.routers.bathong_alias.tls=true
      - traefik.http.routers.bathong_alias.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_alias.middlewares=bathong-primary
      - traefik.http.routers.bathong_alias.service=bathong_holding
      - traefik.http.middlewares.bathong-primary.redirectregex.regex=^https?://[^/]+/(.*)
      - traefik.http.middlewares.bathong-primary.redirectregex.replacement=https://${SITE_DOMAIN}/$${1}
      - traefik.http.middlewares.bathong-primary.redirectregex.permanent=true

  bathong_db:
    profiles: ["platform"]
    image: postgres:16-alpine
    container_name: ${SITE_DOMAIN}_db
    restart: always
    environment:
      POSTGRES_DB: bathong
      POSTGRES_USER: bathong
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bathong -d bathong']
      interval: 5s
      timeout: 3s
      retries: 24
    labels:
      - traefik.enable=false

  bathong_payload:
    profiles: ["platform"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PAYLOAD_PUBLIC_SERVER_URL: https://api.${SITE_DOMAIN}
    image: bathong-payload:latest
    container_name: ${SITE_DOMAIN}_payload
    restart: always
    volumes:
      - ./media:/app/media
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://bathong:${DB_PASSWORD}@${SITE_DOMAIN}_db:5432/bathong
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: https://api.${SITE_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_DOMAIN: .${SITE_DOMAIN}
      MEDIA_DIR: /app/media
    depends_on:
      bathong_db:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.bathong_payload.rule=Host(`api.${SITE_DOMAIN}`)
      - traefik.http.routers.bathong_payload.tls=true
      - traefik.http.routers.bathong_payload.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_payload.middlewares=bathong-api-ratelimit
      - traefik.http.services.bathong_payload.loadbalancer.server.port=3001
      # Rate limits: a modest ceiling on the whole API, a strict one on the
      # endpoints an anonymous visitor can write to (login, RSVP create).
      - traefik.http.middlewares.bathong-api-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.bathong-api-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.bathong-strict-ratelimit.ratelimit.average=1
      - traefik.http.middlewares.bathong-strict-ratelimit.ratelimit.burst=5
      - traefik.http.routers.bathong_payload_strict.rule=Host(`api.${SITE_DOMAIN}`) && (PathPrefix(`/api/users/login`) || ((Path(`/api/rsvps`) || Path(`/api/photocall-entries`)) && Method(`POST`)))
      - traefik.http.routers.bathong_payload_strict.priority=100
      - traefik.http.routers.bathong_payload_strict.tls=true
      - traefik.http.routers.bathong_payload_strict.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_payload_strict.middlewares=bathong-strict-ratelimit
      - traefik.http.routers.bathong_payload_strict.service=bathong_payload

  # Staging router (#39): the real site at next.${SITE_DOMAIN} behind basic
  # auth while the holding page keeps the primary host. The M3 cutover (#12)
  # later swaps the primary Host rule to this service and drops the auth.
  bathong_nuxt:
    profiles: ["platform"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: bathong-nuxt:latest
    container_name: ${SITE_DOMAIN}_nuxt
    restart: always
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_CMS_URL: https://api.${SITE_DOMAIN}
      NUXT_CMS_INTERNAL_URL: http://${SITE_DOMAIN}_payload:3001
      # Canonical origin for og/canonical URLs; flips to https://${SITE_DOMAIN}
      # in .env at cutover.
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://next.${SITE_DOMAIN}}
    depends_on:
      - bathong_payload
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.bathong_next.rule=Host(`next.${SITE_DOMAIN}`)
      - traefik.http.routers.bathong_next.tls=true
      - traefik.http.routers.bathong_next.tls.certresolver=lets-encrypt
      - traefik.http.routers.bathong_next.middlewares=bathong-next-auth
      - traefik.http.services.bathong_nuxt.loadbalancer.server.port=3000
      # htpasswd bcrypt user:hash from .env (STAGING_BASIC_AUTH). Generate with
      # `htpasswd -nB bathong`; double every $ as $$ inside .env so compose
      # does not try to interpolate the hash.
      - traefik.http.middlewares.bathong-next-auth.basicauth.users=${STAGING_BASIC_AUTH}

volumes:
  db_data: {}
