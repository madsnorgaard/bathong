name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Design tokens drift check
        run: npm run tokens:check
      - name: Payload types drift check
        run: npm run types:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bathong
          POSTGRES_PASSWORD: bathong-ci
          POSTGRES_DB: bathong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bathong"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URI: postgresql://bathong:bathong-ci@localhost:5432/bathong
      PAYLOAD_SECRET: ci-only-secret-not-production
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3000
      NUXT_PUBLIC_CMS_URL: http://localhost:3001
      NUXT_PUBLIC_SITE_URL: https://bathong.africa
      SEED_DEMO: 'true'
      # ci-only login for the admin-panel specs (admin-sequence.spec.ts)
      SEED_ADMIN_EMAIL: admin@bathong.ci
      SEED_ADMIN_PASSWORD: ci-only-admin-password
      # ci-only member login for the account specs (account.spec.ts)
      SEED_MEMBER_PASSWORD: ci-only-member-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend
        working-directory: backend
        run: npm ci --legacy-peer-deps
      - name: Migrate and seed
        working-directory: backend
        run: |
          npm run migrate
          npm run seed
      - name: Start backend
        working-directory: backend
        run: |
          npm run dev &
          # http-get:// - wait-on's default HEAD probe 404s on this endpoint
          npx wait-on -t 120000 http-get://localhost:3001/api/access
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright smoke
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
