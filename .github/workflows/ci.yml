name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Design tokens drift check
        run: npm run tokens:check
      - name: Payload types drift check
        run: npm run types:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # A bad image-cache config would take every photograph down in production,
  # and nothing else exercises it before the deploy.
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: nginx config test (image cache)
        run: docker run --rm -v "$PWD/ops/nginx:/etc/nginx/conf.d:ro" nginx:alpine nginx -t

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bathong
          POSTGRES_PASSWORD: bathong-ci
          POSTGRES_DB: bathong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bathong"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URI: postgresql://bathong:bathong-ci@localhost:5432/bathong
      PAYLOAD_SECRET: ci-only-secret-not-production
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3000
      NUXT_PUBLIC_CMS_URL: http://localhost:3001
      NUXT_PUBLIC_SITE_URL: https://bathong.africa
      SEED_DEMO: 'true'
      # ci-only login for the admin-panel specs (admin-sequence.spec.ts)
      SEED_ADMIN_EMAIL: admin@bathong.ci
      SEED_ADMIN_PASSWORD: ci-only-admin-password
      # ci-only member login for the account specs (account.spec.ts)
      SEED_MEMBER_PASSWORD: ci-only-member-password
      # admin-only test doors that read verification tokens (sign-up.spec.ts)
      E2E_HOOKS: 'true'
      # Where uploads are written and read. This is the directory the backend
      # falls back to anyway (repo /media); it is spelled out so the seed
      # (tsx), the built server and the photocall uploads cannot disagree
      # about it, whatever a bundler makes of the fallback path.
      MEDIA_DIR: ${{ github.workspace }}/media
      # ipx fetches its sources by address, not by name. Resolving
      # "localhost" goes through Node's four-thread pool, the same pool every
      # sharp encode runs on; behind a queue of cold encodes the lookup waits
      # past undici's 10 s connect timeout and the image answers 500
      # (ConnectTimeoutError ... localhost:3001), however fast the backend
      # is. An address needs no lookup. Production sets the same variable to
      # the internal Payload host (nuxt.config.ts).
      IPX_SOURCE_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install backend
        working-directory: backend
        run: npm ci --legacy-peer-deps
      # The suite runs against the built backend, as production does
      # (backend/Dockerfile: next build, then migrate, then next start). The
      # dev server compiled each route on its first hit, in the middle of the
      # run, on the same two cores the photographs are encoded on: four runs
      # failed on 4 Oct 2026, none from a regression. The build reads the job
      # env but opens no database connection; E2E_HOOKS and MEDIA_DIR are
      # read when the server starts, not baked in here.
      - name: Build backend
        working-directory: backend
        run: npm run build
      # Before the server starts: both talk to Postgres directly (the seed
      # through Payload's local API, no HTTP), and the server then only ever
      # sees a migrated, fully seeded database.
      - name: Migrate and seed
        working-directory: backend
        run: |
          npm run migrate
          npm run seed
      - name: Start backend (built)
        working-directory: backend
        run: |
          npm run start > "$RUNNER_TEMP/backend.log" 2>&1 &
          # http-get:// - wait-on's default HEAD probe 404s on this endpoint
          npx wait-on -t 120000 http-get://localhost:3001/api/access
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          # The runner ships a google-chrome apt source whose mirror metadata
          # goes stale (hash sum mismatch) and fails the apt update inside
          # --with-deps. CI runs chromium, not Chrome, so drop every source
          # that points at dl.google.com, whatever the file is called.
          grep -rl dl.google.com /etc/apt/sources.list.d/ | xargs -r sudo rm -f
          npx playwright install --with-deps chromium
      - name: Playwright smoke
        working-directory: frontend
        run: npm run test:e2e
      # The server writes to a file, not to the job log, so a failed run says
      # what the backend saw: a boot that never answered, or a 500 in a test.
      - name: Backend log
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/backend.log" ]; then
            cat "$RUNNER_TEMP/backend.log"
          else
            echo "The backend never started: no log was written."
          fi
      # A test that failed once and passed on its retry leaves the job green
      # and its trace in test-results (#224). Keep that evidence too, with the
      # backend log beside it, so the next occurrence explains itself. When
      # every test passed first time there is nothing to keep: Playwright
      # removes the output of passing tests and leaves no directory behind.
      - name: Collect the evidence of a failed attempt
        id: evidence
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(find frontend/test-results -mindepth 1 -type d 2>/dev/null | head -n 1)" ]; then
            cp "$RUNNER_TEMP/backend.log" frontend/test-results/backend.log 2>/dev/null || true
            echo "keep=true" >> "$GITHUB_OUTPUT"
            echo "A test failed at least once; test-results is uploaded as an artifact."
          else
            echo "keep=false" >> "$GITHUB_OUTPUT"
            echo "Every test passed first time; nothing to upload."
          fi
      - name: Upload Playwright results
        if: ${{ !cancelled() && steps.evidence.outputs.keep == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
