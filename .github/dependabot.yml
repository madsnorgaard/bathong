version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # All Payload packages must move together. A partial bump (@payloadcms/next 3.89
      # against payload 3.84) broke the aksel-pedersen backend image on 2026-09-17.
      payload:
        patterns: ["payload", "@payloadcms/*"]
      # Every other minor and patch update moves in one pull request. Each
      # pull request runs the whole suite, about 25 Actions minutes on a
      # private repository, and on 5 Oct 2026 eight separate ones cost over
      # three hours of them. A major stays on its own: it is a decision.
      routine:
        patterns: ["*"]
        exclude-patterns: ["payload", "@payloadcms/*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is the new native compiler; upgrade deliberately (#109 failed the backend check).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One pull request for every minor and patch update, for the same
      # reason as in /backend. A major stays on its own.
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Nuxt 3 site; a Nuxt 4 bump is a deliberate migration, not a Dependabot merge.
      - dependency-name: "nuxt"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 crashes vue-tsc, which the typecheck gate runs (#193
      # failed on it). Upgrade deliberately, together with vue-tsc.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # A Postgres major needs a dump/restore of the data volume; postgres 18 will not
      # start on the 16 data directory (#106). Never via Dependabot.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # the actions move together: one pull request, one run of the suite
      actions:
        patterns: ["*"]
