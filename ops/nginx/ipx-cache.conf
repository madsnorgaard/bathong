# Result cache for ipx image transforms. AVIF encodes are CPU-expensive and
# nitro has no server-side cache, so without this every visitor re-encodes
# every image they view. Each variant is encoded once and served from disk;
# proxy_cache_lock collapses a thundering herd on the same URL into a single
# upstream encode.
#
# No visitor waits for a re-encode: an entry older than 30 days is answered
# from the stale copy at once and refreshed by a background request (measured
# before this: 5 to 13 seconds per image on the essay reader after expiry).
# The 30 days only bound how long a file replaced under the same name can
# stay stale. Entries nobody asks for are dropped after a year, and max_size
# evicts the least recently used before the disk fills.
#
# This directory is mounted as /etc/nginx/conf.d, so the running container
# sees an edit; ops/deploy.sh tests the config and reloads it gracefully.
#
# The upstream hostname is the compose container_name (${SITE_DOMAIN}_nuxt) -
# nginx confs can't interpolate env, so it is hardcoded here.

proxy_cache_path /var/cache/nginx/ipx levels=1:2 keys_zone=ipx:20m max_size=5g
                 inactive=365d use_temp_path=off;

server {
  listen 80;

  location /_ipx/ {
    # Docker's embedded DNS via a variable: resolved per-request, so nginx
    # boots fine even if the nuxt container isn't up yet (a static upstream
    # is resolved at config load and crash-loops on failure).
    resolver 127.0.0.11 valid=30s;
    set $ipx_upstream http://bathong.africa_nuxt:3000;
    proxy_pass $ipx_upstream;
    proxy_set_header Host $host;

    proxy_cache ipx;
    proxy_cache_key $uri;              # format + width are in the path; no Vary needed
    proxy_cache_lock on;               # one encode per URL, however many wait
    proxy_cache_lock_timeout 120s;
    proxy_cache_use_stale updating error timeout;
    proxy_cache_background_update on;  # expired: serve the stale copy, refresh behind it
    proxy_read_timeout 120s;           # cold AVIF encode of a 2560px source takes seconds

    # Decide caching HERE, not from upstream headers: nitro stamps immutable
    # max-age on every /_ipx response including errors, and a year-cached 500
    # would be catastrophic. Only 200s are cached; errors always retry.
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 30d;

    add_header X-Cache-Status $upstream_cache_status;
  }
}
