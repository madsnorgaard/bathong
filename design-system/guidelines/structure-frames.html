<!-- @dsCard group="Spacing" viewport="700x190" name="Borders & radius" subtitle="2px ink frame everywhere · hairline on ink · radius 0" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="background:var(--paper);padding:22px">
<div style="display:flex;gap:16px;align-items:stretch">
<div style="flex:1;border:var(--border-frame);padding:14px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase">--border-frame<br>2px solid ink</div>
<div style="flex:1;background:var(--ink);color:var(--paper);border:var(--hairline);padding:14px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase">--hairline<br>1px grey-line, on ink only</div>
<div style="flex:1;border:var(--border-frame);border-radius:var(--radius);padding:14px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase">--radius 0<br>prints have corners</div>
</div></body></html>
