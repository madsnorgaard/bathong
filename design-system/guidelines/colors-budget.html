<!-- @dsCard group="Colors" viewport="700x150" name="Surface budget" subtitle="Paper 60 / ink 30 / jacaranda 8 / signal 2 per page" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="background:var(--paper);padding:22px">
<div style="display:flex;height:60px;border:2px solid var(--ink)">
<div style="flex:60;background:var(--paper);display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em">PAPER 60</div>
<div style="flex:30;background:var(--ink);color:var(--paper);display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em">INK 30</div>
<div style="flex:8;background:var(--jacaranda);display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.12em">8</div>
<div style="flex:2;background:var(--signal)"></div></div>
<p style="font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-warm);margin-top:10px">Signal is never a background for long text</p>
</body></html>
