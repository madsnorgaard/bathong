<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="background:var(--paper);padding:18px 22px">
<table style="width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase">
<tr><td style="padding:5px 0;color:var(--grey-warm);width:38%">--text-mark</td><td>clamp(4.2rem, 17.5vw, 15.5rem)</td></tr>
<tr><td style="padding:5px 0;color:var(--grey-warm)">--text-display-1</td><td>clamp(2.2rem, 6vw, 4.6rem)</td></tr>
<tr><td style="padding:5px 0;color:var(--grey-warm)">--text-display-2</td><td>clamp(1.3rem, 2.6vw, 2rem)</td></tr>
<tr><td style="padding:5px 0;color:var(--grey-warm)">--text-lede</td><td>clamp(1.05rem, 2.1vw, 1.5rem)</td></tr>
<tr><td style="padding:5px 0;color:var(--grey-warm)">--text-body</td><td>1rem</td></tr>
<tr><td style="padding:5px 0;color:var(--grey-warm)">--text-caption</td><td>.75rem</td></tr>
<tr><td style="padding:5px 0;color:var(--grey-warm)">--text-micro</td><td>.68rem</td></tr>
</table></body></html>
