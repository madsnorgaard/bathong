<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Share card exports</title><link rel="stylesheet" href="../../styles.css">
<style>
body{background:#9c9c9c;padding:30px;display:flex;flex-direction:column;gap:30px;align-items:flex-start}
.lbl{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;margin-bottom:8px}
.og{width:1200px;height:630px;background:#141313;display:flex;flex-direction:column;overflow:hidden}
.og .photo{flex:1;background-size:cover;background-position:center;position:relative}
.og .bar{background:#141313;padding:26px 40px;display:flex;align-items:center;justify-content:space-between;gap:30px;border-top:4px solid #7B5CD6;height:120px}
.og .wm{font-family:var(--font-display);text-transform:uppercase;font-size:44px;letter-spacing:-.035em;line-height:1;color:#F2EEE6}
.og .wm i{color:#7B5CD6;font-style:normal}
.og .meta{font-family:var(--font-mono);font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#A09B90;text-align:right;line-height:1.7}
.og .cred{position:absolute;left:0;bottom:0;background:#141313;color:#CFCABF;font-family:var(--font-mono);font-size:18px;letter-spacing:.12em;text-transform:uppercase;padding:12px 20px}
</style></head><body>
<div><div class="lbl">share/default (1200x630)</div>
<div class="og" id="c-default">
<div class="photo" style="background-image:url('../photos/johannesburg/street-0002.jpg')"><div class="cred">© Mads Nørgaard</div></div>
<div class="bar"><div class="wm">Bathong<i>.</i></div><div class="meta">Street &amp; documentary photography<br>Pitori · 012</div></div>
</div></div>
</body></html>
