# Local development stack: Postgres only. Both apps run on the host:
#   docker compose -f docker-compose.dev.yml up -d
#   cd backend  && npm run dev   (port 3001, needs backend/.env)
#   cd frontend && npm run dev   (port 3000)
# See docs/PLATFORM.md for the full workflow.
services:
  bathong_dev_db:
    image: postgres:16-alpine
    container_name: bathong_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bathong
      POSTGRES_PASSWORD: bathong-dev
      POSTGRES_DB: bathong
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bathong -d bathong']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev_db_data:
